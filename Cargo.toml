[workspace]
resolver = "2"
members = [
  "contracts/event-schema",
  "contracts/sbt-identity",
  "contracts/smart-account",
  "contracts/payment-streaming",
]

[workspace.dependencies]
soroban-sdk = "22.0.0"

# Soroban charges deployment fees proportional to WASM size, so release
# builds are tuned for the smallest possible binary.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
