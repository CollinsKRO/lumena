[workspace]
resolver = "2"
members = [
    "contracts/spend-policy",
    "contracts/ttl-manager",
    "contracts/escrow",
    "contracts/security-utils",
]

[workspace.dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
soroban-sdk-no-testutils = { package = "soroban-sdk", version = "21.0.0" }
syn = { version = "2.0", features = ["full", "parsing", "printing", "proc-macro", "derive"] }
quote = "1.0"
proc-macro2 = "1.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
