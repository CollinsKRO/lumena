[package]
name = "smart-account"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
event-schema = { path = "../event-schema" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1"

[[test]]
name = "fuzz"
path = "__tests__/fuzz/main.rs"
