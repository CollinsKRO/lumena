services:
  lumen-server:
    build:
      context: ..
      dockerfile: packages/server/Dockerfile
    environment:
      STELLAR_NETWORK: local
      HORIZON_URL: http://stellar:8000
      SOROBAN_RPC_URL: http://stellar:8000/rpc
      REDIS_SENTINEL_HOSTS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      REDIS_MASTER_NAME: mymaster
      DATABASE_URL: postgres://lumen:lumen@postgres:5432/lumen
    ports:
      - "3000:3000"
    depends_on:
      stellar:
        condition: service_healthy

  stellar:
    image: stellar/quickstart:testing
    command: ["--local"]
    ports:
      - "8000:8000"
      - "8080:8080"
      - "6000:6000"
    volumes:
      - stellar-data:/data
    platform: linux/amd64
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  stellar-data:
